<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>X.hunter77 Store</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #0b0b0d;
            --card: #1c1c1e;
            --text: #ffffff;
            --muted: #8e8e93;
            --accent: #b32cb6;
            --danger: #ff453a;
            --success: #32d74b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }

        body { background-color: var(--bg); color: var(--text); padding-bottom: 85px; min-height: 100vh; }

        /* Шапка */
        .header { position: sticky; top: 0; background: rgba(11, 11, 13, 0.95); backdrop-filter: blur(10px); padding: 16px; z-index: 100; display: flex; align-items: center; gap: 10px; }
        .shop-name { font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 4px; white-space: nowrap; }
        .verified { color: #3b82f6; font-size: 16px; }
        .search-box { flex: 1; background: var(--card); border: none; color: white; padding: 12px 16px; border-radius: 12px; font-size: 15px; outline: none; }

        /* Экраны */
        .screen { display: none; padding: 0 16px; animation: fadeIn 0.2s ease; }
        .screen.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* Каталог */
        .catalog { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 16px; }
        .product-card { background: var(--card); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; position: relative; cursor: pointer; }
        .img-container { width: 100%; aspect-ratio: 1; background: #2c2c2e; position: relative; }
        .product-image { width: 100%; height: 100%; object-fit: cover; }
        
        .delete-btn-card { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.7); color: var(--danger); border: none; width: 30px; height: 30px; border-radius: 50%; font-weight: bold; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 2; }
        .fav-btn-card { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.5); color: white; border: none; width: 32px; height: 32px; border-radius: 50%; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 2; backdrop-filter: blur(5px); transition: 0.2s; }
        .fav-btn-card.active { color: #ff2d55; }
        
        .product-info { padding: 12px; display: flex; flex-direction: column; flex: 1; }
        .product-title { font-size: 14px; font-weight: 500; line-height: 1.3; margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .product-price { font-size: 18px; font-weight: 800; color: var(--text); margin-top: auto; margin-bottom: 10px; }
        .btn-add-cart { width: 100%; background: #2c2c2e; color: var(--text); border: none; padding: 10px; border-radius: 10px; font-weight: 600; font-size: 14px; cursor: pointer; }
        .btn-add-cart.in-cart { background: var(--accent); color: white; }

        /* Корзина */
        .cart-item { display: flex; gap: 12px; background: var(--card); padding: 12px; border-radius: 16px; margin-bottom: 12px; }
        .cart-img { width: 80px; height: 80px; border-radius: 12px; object-fit: cover; }
        .cart-details { flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .cart-title { font-size: 14px; font-weight: 500; }
        .cart-price { font-size: 16px; font-weight: 700; }
        .qty-controls { display: flex; align-items: center; gap: 12px; background: #2c2c2e; padding: 4px 8px; border-radius: 8px; width: fit-content; }
        .qty-btn { background: none; border: none; font-size: 18px; font-weight: bold; cursor: pointer; color: var(--text); width: 24px; }
        
        .cart-bottom { position: fixed; bottom: 75px; left: 0; right: 0; background: var(--card); padding: 16px; box-shadow: 0 -4px 20px rgba(0,0,0,0.5); display: flex; justify-content: space-between; align-items: center; border-radius: 20px 20px 0 0; z-index: 90; border-top: 1px solid #2c2c2e; }
        .total-price { font-size: 22px; font-weight: 800; }
        .btn-checkout { background: var(--accent); color: white; border: none; padding: 14px 24px; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; }

        /* Нижнее меню */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 75px; background: var(--card); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #2c2c2e; z-index: 100; padding-bottom: env(safe-area-inset-bottom); }
        .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 10px; color: var(--muted); cursor: pointer; gap: 4px; position: relative; width: 70px; }
        .nav-item.active { color: var(--accent); }
        .nav-icon { font-size: 24px; }
        .cart-badge { position: absolute; top: -4px; right: 15px; background: var(--danger); color: white; font-size: 10px; font-weight: bold; min-width: 18px; height: 18px; border-radius: 9px; display: flex; align-items: center; justify-content: center; display: none; padding: 0 4px; }

        /* Админка и Профиль */
        .admin-panel, .user-panel { background: var(--card); border-radius: 16px; padding: 20px; text-align: center; margin-top: 16px; }
        .btn-add-product { background: var(--accent); color: white; border: none; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: bold; width: 100%; cursor: pointer; margin-bottom: 10px; }
        .btn-copy { background: #2c2c2e; color: white; border: none; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: bold; width: 100%; cursor: pointer; }
        
        .profile-info { text-align: left; font-size: 14px; margin-bottom: 20px; line-height: 1.6; }
        .profile-info span { color: var(--muted); }

        /* Модальные окна */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 16px; }
        .modal-overlay.active { display: flex; }
        .modal { background: var(--card); width: 100%; max-width: 400px; border-radius: 20px; padding: 20px; max-height: 90vh; overflow-y: auto; }
        .modal h2 { font-size: 18px; margin-bottom: 16px; text-align: center; }

        /* Формы */
        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
        .input-group input, .input-group textarea { width: 100%; background: var(--bg); border: 1px solid #2c2c2e; color: white; padding: 12px; border-radius: 10px; font-size: 14px; outline: none; }
        .file-upload-wrapper { position: relative; overflow: hidden; }
        .file-upload-btn { border: 1.5px dashed var(--accent); color: var(--accent); padding: 16px; border-radius: 10px; text-align: center; display: block; font-weight: 600; }
        .file-upload-wrapper input[type=file] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        .preview-container { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
        .preview-img { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; }
        .btn-save { background: var(--accent); color: white; border: none; padding: 14px; width: 100%; border-radius: 12px; font-weight: bold; font-size: 16px; margin-top: 10px; }
        .btn-close { background: transparent; color: var(--muted); border: none; width: 100%; padding: 12px; font-weight: bold; font-size: 14px; margin-top: 5px; }

        /* Просмотр товара */
        .full-product-img { width: 100%; height: 300px; object-fit: contain; background: #000; border-radius: 12px; margin-bottom: 12px; }
        .full-product-title { font-size: 22px; font-weight: bold; margin-bottom: 8px; }
        .full-product-price { font-size: 24px; color: var(--accent); font-weight: bold; margin-bottom: 12px; }
        .full-product-desc { font-size: 14px; color: var(--muted); line-height: 1.5; margin-bottom: 20px; }

        .empty-state { text-align: center; color: var(--muted); padding: 40px 0; font-size: 15px; grid-column: 1 / -1; }

        /* ВЫБОР ОПЛАТЫ */
        .payment-methods { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
        .payment-option { background: var(--bg); border: 1px solid #2c2c2e; border-radius: 12px; padding: 12px; display: flex; align-items: center; gap: 10px; cursor: pointer; transition: 0.2s; }
        .payment-option.active { border-color: var(--accent); background: rgba(179, 44, 182, 0.1); }
        .payment-option input[type="radio"] { display: none; }
        .radio-custom { width: 20px; height: 20px; border: 2px solid var(--muted); border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .payment-option.active .radio-custom { border-color: var(--accent); }
        .radio-custom::after { content: ''; width: 10px; height: 10px; background: var(--accent); border-radius: 50%; opacity: 0; transition: 0.2s; }
        .payment-option.active .radio-custom::after { opacity: 1; }
        .payment-text { font-size: 15px; font-weight: 500; }
        
        .requisites-box { display: none; background: #2c2c2e; padding: 16px; border-radius: 12px; margin-bottom: 16px; text-align: center; }
        .requisites-box.active { display: block; }
        .copy-btn { background: var(--success); color: black; border: none; padding: 10px 16px; border-radius: 8px; font-weight: bold; margin-top: 12px; cursor: pointer; font-size: 14px; width: 100%; }
    </style>
</head>
<body>

    <!-- ШАПКА -->
    <div class="header">
        <div class="shop-name">X.hunter77 <span class="verified">✔</span></div>
        <input type="text" class="search-box" id="searchInput" placeholder="Искать товар...">
    </div>

    <!-- ЭКРАН 1: ГЛАВНАЯ -->
    <div class="screen active" id="screen-home">
        <div class="catalog" id="catalog"></div>
    </div>

    <!-- ЭКРАН 2: ИЗБРАННОЕ -->
    <div class="screen" id="screen-favorites">
        <h2 style="margin-top: 16px;">Избранное</h2>
        <div class="catalog" id="favorites-catalog"></div>
        <div class="empty-state" id="fav-empty" style="display: none;">Нет избранных товаров ❤️</div>
    </div>

    <!-- ЭКРАН 3: КОРЗИНА -->
    <div class="screen" id="screen-cart">
        <h2 style="margin-top: 16px;">Корзина</h2>
        <div id="cart-items"></div>
        <div class="empty-state" id="cart-empty" style="display: none;">Корзина пуста 🛒</div>
    </div>

    <!-- ЭКРАН 4: ПРОФИЛЬ -->
    <div class="screen" id="screen-profile">
        <h2 style="margin-top: 16px;">Профиль</h2>
        
        <div class="admin-panel" id="admin-panel" style="display: none;">
            <p style="font-size: 14px; color: var(--accent); font-weight: bold; margin-bottom: 16px;">👑 Вы вошли как Администратор</p>
            <button class="btn-add-product" id="openAddModalBtn">➕ Добавить товар</button>
            <button class="btn-copy" onclick="copyBotLink()">🔗 Ссылка на бота</button>
        </div>

        <div class="user-panel" id="user-panel">
            <p style="font-size: 16px; font-weight: bold; margin-bottom: 10px;">Добро пожаловать!</p>
            <div class="profile-info" id="user-data-display"></div>
            <button class="btn-add-product" id="editProfileBtn">✏️ Изменить мои данные</button>
        </div>
    </div>

    <!-- ПАНЕЛЬ СНИЗУ -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('home')">
            <span class="nav-icon">🏠</span> Главная
        </div>
        <div class="nav-item" onclick="switchTab('favorites')">
            <span class="nav-icon">❤️</span> Избранное
        </div>
        <div class="nav-item" onclick="switchTab('cart')">
            <span class="nav-icon">🛒</span> Корзина
            <div class="cart-badge" id="cart-badge">0</div>
        </div>
        <div class="nav-item" onclick="switchTab('profile')">
            <span class="nav-icon">👤</span> Профиль
        </div>
    </div>

    <!-- ПАНЕЛЬ ОФОРМЛЕНИЯ ЗАКАЗА -->
    <div class="cart-bottom" id="cart-bottom-bar" style="display: none;">
        <div>
            <div style="font-size: 12px; color: var(--muted);">Итого</div>
            <div class="total-price" id="total-price">0 ₽</div>
        </div>
        <button class="btn-checkout" onclick="openCheckoutModal()">Оформить</button>
    </div>

    <!-- МОДАЛКА ПРОСМОТРА ТОВАРА -->
    <div class="modal-overlay" id="viewModal">
        <div class="modal">
            <img src="" class="full-product-img" id="viewImage">
            <div class="full-product-title" id="viewName"></div>
            <div class="full-product-price" id="viewPrice"></div>
            <div class="full-product-desc" id="viewDesc"></div>
            <button class="btn-save" id="viewAddToCartBtn">Добавить в корзину</button>
            <button class="btn-close" onclick="closeViewModal()">Закрыть</button>
        </div>
    </div>

    <!-- МОДАЛКА ОФОРМЛЕНИЯ ЗАКАЗА -->
    <div class="modal-overlay" id="checkoutModal">
        <div class="modal">
            <h2>Оформление заказа</h2>
            
            <div class="input-group">
                <label>Ваше Имя</label>
                <input type="text" id="checkoutName" placeholder="Иван">
            </div>
            <div class="input-group">
                <label>Номер телефона</label>
                <input type="tel" id="checkoutPhone" placeholder="+7 (999) 000-00-00">
            </div>
            <div class="input-group">
                <label>Город и адрес</label>
                <input type="text" id="checkoutAddress" placeholder="Москва, ул. Ленина 1">
            </div>

            <!-- ВЫБОР ОПЛАТЫ -->
            <div class="input-group" style="margin-top: 20px;">
                <label>Способ оплаты</label>
                <div class="payment-methods">
                    <label class="payment-option active" id="payOptCash" onclick="selectPayment('cash')">
                        <input type="radio" name="payment" value="cash" checked>
                        <div class="radio-custom"></div>
                        <span class="payment-text">💵 При получении</span>
                    </label>
                    <label class="payment-option" id="payOptCard" onclick="selectPayment('card')">
                        <input type="radio" name="payment" value="card">
                        <div class="radio-custom"></div>
                        <span class="payment-text">💳 Перевод по СБП (Т-Банк)</span>
                    </label>
                </div>
            </div>

            <!-- БЛОК С РЕКВИЗИТАМИ -->
            <div class="requisites-box" id="requisitesBox">
                <p style="font-size: 14px; margin-bottom: 8px;">Переведите сумму по СБП:</p>
                <div style="font-size: 15px; font-weight: bold; margin-bottom: 4px;" id="bankNameDisplay"></div>
                <div style="font-size: 14px; margin-bottom: 8px; color: var(--muted);" id="holderNameDisplay"></div>
                <div style="font-size: 20px; font-weight: bold; letter-spacing: 1px;" id="phoneNumberDisplay"></div>
                <button class="copy-btn" onclick="copyPhone()">📋 Скопировать номер</button>
            </div>

            <button class="btn-save" onclick="submitOrder()">Отправить заказ</button>
            <button class="btn-close" onclick="closeCheckoutModal()">Отмена</button>
        </div>
    </div>

    <!-- МОДАЛКА ДОБАВЛЕНИЯ ТОВАРА (АДМИН) -->
    <div class="modal-overlay" id="addModal">
        <div class="modal">
            <h2>Новый товар</h2>
            <div class="input-group">
                <label>Название</label>
                <input type="text" id="addName" placeholder="Кроссовки Nike Air">
            </div>
            <div class="input-group">
                <label>Цена (₽)</label>
                <input type="text" inputmode="numeric" id="addPrice" placeholder="Например: 14565">
            </div>
            <div class="input-group">
                <label>Описание</label>
                <textarea id="addDesc" placeholder="Размер 42, состояние идеал..."></textarea>
            </div>
            <div class="input-group">
                <label>Фото</label>
                <div class="file-upload-wrapper">
                    <span class="file-upload-btn">📸 Выбрать фото</span>
                    <input type="file" id="addImages" accept="image/*" multiple>
                </div>
                <div class="preview-container" id="imagePreview"></div>
            </div>
            <button class="btn-save" id="saveProductBtn">Сохранить товар</button>
            <button class="btn-close" onclick="closeAddModal()">Отмена</button>
        </div>
    </div>

    <script>
        // ==========================================
        // НАСТРОЙКИ
        const ADMIN_ID = 8264874574; 
        const SELLER_USERNAME = 'fhdhdjwdp'; 
        const BOT_USERNAME = 'xhunter77_store_bot'; 
        
        // ТВОИ РЕКВИЗИТЫ (Уже вставлены)
        const PAYMENT_PHONE = '+7 989 900-11-27'; // Номер для СБП
        const CARD_HOLDER = 'Заур А.'; 
        const BANK_NAME = 'Т-Банк'; 
        // ==========================================

        const tg = window.Telegram?.WebApp;
        if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor('#0b0b0d'); tg.setBackgroundColor('#0b0b0d'); }

        const currentUser = tg?.initDataUnsafe?.user;
        const isAdmin = currentUser && currentUser.id === ADMIN_ID;

        if (isAdmin) {
            document.getElementById('admin-panel').style.display = 'block';
            document.getElementById('user-panel').style.display = 'none';
        }

        let products = JSON.parse(localStorage.getItem('hunter_products')) || [];
        let cart = JSON.parse(localStorage.getItem('hunter_cart')) || [];
        let favorites = JSON.parse(localStorage.getItem('hunter_favorites')) || [];
        let userProfile = JSON.parse(localStorage.getItem('hunter_profile')) || { name: '', phone: '', address: '' };
        
        let currentImagesBase64 = [];
        let selectedPaymentMethod = 'cash'; 

        function formatPrice(price) {
            return String(Math.floor(price)).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
        }

        // --- ВЫБОР ОПЛАТЫ ---
        function selectPayment(type) {
            selectedPaymentMethod = type;
            document.getElementById('payOptCash').classList.remove('active');
            document.getElementById('payOptCard').classList.remove('active');
            document.getElementById('requisitesBox').classList.remove('active');

            if (type === 'cash') {
                document.getElementById('payOptCash').classList.add('active');
            } else {
                document.getElementById('payOptCard').classList.add('active');
                document.getElementById('requisitesBox').classList.add('active');
                
                // Заполняем данные для перевода
                document.getElementById('bankNameDisplay').innerText = BANK_NAME;
                document.getElementById('holderNameDisplay').innerText = CARD_HOLDER;
                document.getElementById('phoneNumberDisplay').innerText = PAYMENT_PHONE;
            }
            if (tg) tg.HapticFeedback.impactOccurred('light');
        }

        function copyPhone() {
            // Очищаем номер от пробелов и дефисов для копирования (оставляем + и цифры)
            const cleanPhone = PAYMENT_PHONE.replace(/[^\d+]/g, ''); 
            navigator.clipboard.writeText(cleanPhone).then(() => {
                if (tg) {
                    tg.HapticFeedback.notificationOccurred('success');
                    tg.showAlert('Номер телефона скопирован!');
                } else {
                    alert('Номер телефона скопирован!');
                }
            });
        }

        // --- НАВИГАЦИЯ ---
        function switchTab(tab) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            document.getElementById(`screen-${tab}`).classList.add('active');
            event.currentTarget.classList.add('active');
            
            if (tab === 'cart') renderCart();
            if (tab === 'home') renderCatalog();
            if (tab === 'favorites') renderFavorites();
            if (tab === 'profile') renderProfile();
        }

        // --- СЖАТИЕ ФОТО ---
        function compressImage(file, maxWidth = 800) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let scale = maxWidth / img.width;
                        if (scale > 1) scale = 1;
                        canvas.width = img.width * scale;
                        canvas.height = img.height * scale;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL('image/jpeg', 0.6));
                    };
                };
            });
        }

        // --- ДОБАВЛЕНИЕ ТОВАРА ---
        document.getElementById('addImages').addEventListener('change', async (e) => {
            const files = e.target.files;
            if (!files.length) return;
            document.getElementById('imagePreview').innerHTML = 'Сжатие...';
            currentImagesBase64 = [];
            for (let i = 0; i < files.length; i++) {
                currentImagesBase64.push(await compressImage(files[i]));
            }
            document.getElementById('imagePreview').innerHTML = '';
            currentImagesBase64.forEach(src => {
                const img = document.createElement('img');
                img.src = src; img.className = 'preview-img';
                document.getElementById('imagePreview').appendChild(img);
            });
        });

        document.getElementById('openAddModalBtn').addEventListener('click', () => {
            document.getElementById('addModal').classList.add('active');
        });
        function closeAddModal() { document.getElementById('addModal').classList.remove('active'); }

        document.getElementById('saveProductBtn').addEventListener('click', () => {
            const name = document.getElementById('addName').value.trim();
            let rawPrice = document.getElementById('addPrice').value;
            const desc = document.getElementById('addDesc').value.trim();

            const cleanDigits = rawPrice.replace(/[^\d]/g, ''); 
            const cleanPrice = parseInt(cleanDigits, 10);

            if (!name || isNaN(cleanPrice) || cleanPrice <= 0 || currentImagesBase64.length === 0) {
                if (tg) tg.showAlert('Заполните все поля корректно и добавьте фото!'); else alert('Заполните все поля!');
                return;
            }

            const newProduct = { id: Date.now(), name, price: cleanPrice, desc: desc || 'Описание отсутствует', images: currentImagesBase64 };
            products.unshift(newProduct);
            localStorage.setItem('hunter_products', JSON.stringify(products));
            
            currentImagesBase64 = [];
            document.getElementById('addName').value = '';
            document.getElementById('addPrice').value = '';
            document.getElementById('addDesc').value = '';
            document.getElementById('imagePreview').innerHTML = '';
            closeAddModal();
            renderCatalog();
            if (tg) tg.HapticFeedback.notificationOccurred('success');
        });

        // --- ОТРИСОВКА КАТАЛОГА ---
        function createProductCard(product) {
            const isInCart = cart.some(c => c.id === product.id);
            const isFav = favorites.includes(product.id);
            
            const card = document.createElement('div');
            card.className = 'product-card';
            
            const deleteBtnHTML = isAdmin 
                ? `<button class="delete-btn-card" onclick="event.stopPropagation(); deleteProduct(${product.id})">✕</button>` 
                : '';

            card.innerHTML = `
                <div class="img-container" onclick="openViewModal(${product.id})">
                    <img src="${product.images[0]}" class="product-image">
                    <button class="fav-btn-card ${isFav ? 'active' : ''}" onclick="event.stopPropagation(); toggleFavorite(${product.id})">${isFav ? '❤️' : '🤍'}</button>
                    ${deleteBtnHTML}
                </div>
                <div class="product-info" onclick="openViewModal(${product.id})">
                    <div class="product-title">${product.name}</div>
                    <div class="product-price">${formatPrice(product.price)} ₽</div>
                </div>
                <div style="padding: 0 12px 12px 12px;">
                    <button class="btn-add-cart ${isInCart ? 'in-cart' : ''}" onclick="event.stopPropagation(); toggleCart(${product.id})">
                        ${isInCart ? 'В корзине' : '🛒 В корзину'}
                    </button>
                </div>
            `;
            return card;
        }

        function renderCatalog(filterText = '') {
            const catalog = document.getElementById('catalog');
            catalog.innerHTML = '';
            
            const filtered = products.filter(p => p.name.toLowerCase().includes(filterText.toLowerCase()));

            if (filtered.length === 0) {
                catalog.innerHTML = `<div class="empty-state">Товаров пока нет</div>`;
                return;
            }

            filtered.forEach(product => {
                catalog.appendChild(createProductCard(product));
            });
        }

        // --- ИЗБРАННОЕ ---
        function toggleFavorite(id) {
            const index = favorites.indexOf(id);
            if (index > -1) {
                favorites.splice(index, 1);
            } else {
                favorites.push(id);
            }
            localStorage.setItem('hunter_favorites', JSON.stringify(favorites));
            renderCatalog(document.getElementById('searchInput').value);
            renderFavorites();
            if (tg) tg.HapticFeedback.impactOccurred('light');
        }

        function renderFavorites() {
            const catalog = document.getElementById('favorites-catalog');
            catalog.innerHTML = '';
            const empty = document.getElementById('fav-empty');

            if (favorites.length === 0) {
                empty.style.display = 'block';
                return;
            }
            empty.style.display = 'none';

            const favProducts = products.filter(p => favorites.includes(p.id));
            favProducts.forEach(product => {
                catalog.appendChild(createProductCard(product));
            });
        }

        // --- ПРОСМОТР ТОВАРА ---
        function openViewModal(id) {
            const product = products.find(p => p.id === id);
            if (!product) return;

            document.getElementById('viewImage').src = product.images[0];
            document.getElementById('viewName').innerText = product.name;
            document.getElementById('viewPrice').innerText = formatPrice(product.price) + ' ₽';
            document.getElementById('viewDesc').innerText = product.desc;

            const btn = document.getElementById('viewAddToCartBtn');
            const isInCart = cart.some(c => c.id === id);
            
            if (isInCart) {
                btn.innerText = 'Убрать из корзины';
                btn.style.background = 'var(--danger)';
            } else {
                btn.innerText = 'Добавить в корзину';
                btn.style.background = 'var(--accent)';
            }

            btn.onclick = () => {
                toggleCart(id);
                closeViewModal();
            };

            document.getElementById('viewModal').classList.add('active');
        }

        function closeViewModal() { document.getElementById('viewModal').classList.remove('active'); }

        // --- КОРЗИНА ---
        function toggleCart(id) {
            const product = products.find(p => p.id === id);
            const cartIndex = cart.findIndex(c => c.id === id);

            if (cartIndex > -1) {
                cart.splice(cartIndex, 1);
            } else {
                cart.push({ ...product, qty: 1 });
            }
            
            localStorage.setItem('hunter_cart', JSON.stringify(cart));
            updateCartBadge();
            renderCatalog(document.getElementById('searchInput').value);
            renderFavorites();
            if (tg) tg.HapticFeedback.impactOccurred('light');
        }

        function updateCartBadge() {
            const badge = document.getElementById('cart-badge');
            const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
            badge.innerText = totalItems;
            badge.style.display = totalItems > 0 ? 'flex' : 'none';
        }

        function renderCart() {
            const container = document.getElementById('cart-items');
            const empty = document.getElementById('cart-empty');
            const bottomBar = document.getElementById('cart-bottom-bar');
            
            container.innerHTML = '';
            
            if (cart.length === 0) {
                empty.style.display = 'block';
                bottomBar.style.display = 'none';
                return;
            }

            empty.style.display = 'none';
            bottomBar.style.display = 'flex';

            let total = 0;

            cart.forEach((item, index) => {
                const itemPrice = Number(item.price);
                total += (itemPrice * item.qty);
                
                const el = document.createElement('div');
                el.className = 'cart-item';
                el.innerHTML = `
                    <img src="${item.images[0]}" class="cart-img">
                    <div class="cart-details">
                        <div class="cart-title">${item.name}</div>
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <div class="cart-price">${formatPrice(itemPrice)} ₽</div>
                            <div class="qty-controls">
                                <button class="qty-btn" onclick="changeQty(${index}, -1)">-</button>
                                <span>${item.qty}</span>
                                <button class="qty-btn" onclick="changeQty(${index}, 1)">+</button>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(el);
            });

            document.getElementById('total-price').innerText = formatPrice(total) + ' ₽';
        }

        function changeQty(index, delta) {
            cart[index].qty += delta;
            if (cart[index].qty <= 0) {
                cart.splice(index, 1);
            }
            localStorage.setItem('hunter_cart', JSON.stringify(cart));
            updateCartBadge();
            renderCart();
            renderCatalog(document.getElementById('searchInput').value);
        }

        // --- ОФОРМЛЕНИЕ ЗАКАЗА ---
        function openCheckoutModal() {
            if (cart.length === 0) return;
            
            document.getElementById('checkoutName').value = userProfile.name || '';
            document.getElementById('checkoutPhone').value = userProfile.phone || '';
            document.getElementById('checkoutAddress').value = userProfile.address || '';
            
            selectPayment('cash'); // По умолчанию наличные
            
            document.getElementById('checkoutModal').classList.add('active');
        }

        function closeCheckoutModal() {
            document.getElementById('checkoutModal').classList.remove('active');
        }

        function submitOrder() {
            const name = document.getElementById('checkoutName').value.trim();
            const phone = document.getElementById('checkoutPhone').value.trim();
            const address = document.getElementById('checkoutAddress').value.trim();

            if (!name || !phone) {
                if (tg) tg.showAlert('Пожалуйста, заполните Имя и Телефон!'); else alert('Заполните Имя и Телефон!');
                return;
            }

            userProfile = { name, phone, address };
            localStorage.setItem('hunter_profile', JSON.stringify(userProfile));

            let message = `🛍 *Новый заказ!*\n\n`;
            let total = 0;

            cart.forEach(item => {
                const itemPrice = Number(item.price);
                const itemTotal = itemPrice * item.qty;
                total += itemTotal;
                message += `▪️ ${item.name}\n   ${item.qty} шт. x ${formatPrice(itemPrice)} ₽ = *${formatPrice(itemTotal)} ₽*\n\n`;
            });

            message += `💰 *ИТОГО: ${formatPrice(total)} ₽*\n\n`;
            message += `👤 *Данные покупателя:*\nИмя: ${name}\nТелефон: ${phone}\nАдрес: ${address || 'Самовывоз / Уточнить'}\n\n`;
            
            if (selectedPaymentMethod === 'cash') {
                message += `💵 *Оплата:* При получении\n`;
            } else {
                message += `💳 *Оплата:* Перевод по СБП (Т-Банк)\n`;
            }

            message += `\nЗдравствуйте! Я оформил заказ.`;

            const encodedMessage = encodeURIComponent(message);
            const url = `https://t.me/${SELLER_USERNAME}?text=${encodedMessage}`;

            closeCheckoutModal();
            
            if (tg) {
                tg.openTelegramLink(url);
            } else {
                window.open(url, '_blank');
            }
        }

        // --- ПРОФИЛЬ ---
        function renderProfile() {
            const display = document.getElementById('user-data-display');
            if (userProfile.name) {
                display.innerHTML = `
                    <div><span>Имя:</span> ${userProfile.name}</div>
                    <div><span>Тел:</span> ${userProfile.phone}</div>
                    <div><span>Адрес:</span> ${userProfile.address || 'Не указан'}</div>
                `;
            } else {
                display.innerHTML = `<p style="color:var(--muted); font-size:13px;">Ваши данные пока не сохранены. Они заполнятся при первом заказе.</p>`;
            }
        }

        document.getElementById('editProfileBtn').addEventListener('click', () => {
            if (cart.length > 0) {
                openCheckoutModal();
            } else {
                if (tg) tg.showAlert('Чтобы обновить данные, добавьте товар в корзину и нажмите "Оформить".');
            }
        });

        // --- УДАЛЕНИЕ ТОВАРА ---
        function deleteProduct(id) {
            if (!isAdmin) return;
            if (tg) {
                tg.showConfirm('Удалить этот товар?', (confirmed) => {
                    if (confirmed) {
                        products = products.filter(p => p.id !== id);
                        cart = cart.filter(c => c.id !== id);
                        favorites = favorites.filter(fid => fid !== id);
                        localStorage.setItem('hunter_products', JSON.stringify(products));
                        localStorage.setItem('hunter_cart', JSON.stringify(cart));
                        localStorage.setItem('hunter_favorites', JSON.stringify(favorites));
                        renderCatalog();
                        renderFavorites();
                        updateCartBadge();
                    }
                });
            }
        }

        // --- КОПИРОВАНИЕ ССЫЛКИ ---
        function copyBotLink() {
            const link = `https://t.me/${BOT_USERNAME}`;
            navigator.clipboard.writeText(link).then(() => {
                if (tg) tg.showAlert('Ссылка на бота скопирована!');
            });
        }

        // --- ПОИСК ---
        document.getElementById('searchInput').addEventListener('input', (e) => {
            renderCatalog(e.target.value);
        });

        // --- СТАРТ ---
        renderCatalog();
        updateCartBadge();

    </script>
</body>
</html>
