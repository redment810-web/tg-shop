<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>X.hunter77 Store</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #0b0b0d;
            --card: #1c1c1e;
            --text: #ffffff;
            --muted: #8e8e93;
            --accent: #b32cb6;
            --danger: #ff453a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }

        body { background-color: var(--bg); color: var(--text); padding-bottom: 80px; min-height: 100vh; }

        /* Шапка */
        .header { position: sticky; top: 0; background: rgba(11, 11, 13, 0.9); backdrop-filter: blur(10px); padding: 16px; z-index: 100; }
        .shop-name { font-size: 20px; font-weight: 800; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
        .verified { color: #3b82f6; font-size: 16px; }
        .search-box { width: 100%; background: var(--card); border: none; color: white; padding: 12px 16px; border-radius: 12px; font-size: 15px; outline: none; }

        /* Экраны */
        .screen { display: none; padding: 0 16px; animation: fadeIn 0.2s ease; }
        .screen.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* Каталог */
        .catalog { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 16px; }
        .product-card { background: var(--card); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; position: relative; }
        .img-container { width: 100%; aspect-ratio: 1; background: #2c2c2e; position: relative; }
        .product-image { width: 100%; height: 100%; object-fit: cover; }
        
        /* Кнопка удаления на карточке (для админа) */
        .delete-btn-card { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.6); color: var(--danger); border: none; width: 30px; height: 30px; border-radius: 50%; font-weight: bold; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        
        .product-info { padding: 12px; display: flex; flex-direction: column; flex: 1; }
        .product-title { font-size: 14px; font-weight: 500; line-height: 1.3; margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .product-price { font-size: 18px; font-weight: 800; color: var(--text); margin-top: auto; margin-bottom: 10px; }
        .btn-add-cart { width: 100%; background: #2c2c2e; color: var(--text); border: none; padding: 10px; border-radius: 10px; font-weight: 600; font-size: 14px; cursor: pointer; transition: 0.2s; }
        .btn-add-cart:active { transform: scale(0.95); }
        .btn-add-cart.in-cart { background: var(--accent); color: white; }

        /* Корзина */
        .cart-item { display: flex; gap: 12px; background: var(--card); padding: 12px; border-radius: 16px; margin-bottom: 12px; }
        .cart-img { width: 80px; height: 80px; border-radius: 12px; object-fit: cover; }
        .cart-details { flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .cart-title { font-size: 14px; font-weight: 500; }
        .cart-price { font-size: 16px; font-weight: 700; }
        .qty-controls { display: flex; align-items: center; gap: 12px; background: #2c2c2e; padding: 4px 8px; border-radius: 8px; width: fit-content; }
        .qty-btn { background: none; border: none; font-size: 18px; font-weight: bold; cursor: pointer; color: var(--text); width: 24px; }
        
        .cart-bottom { position: fixed; bottom: 65px; left: 0; right: 0; background: var(--card); padding: 16px; box-shadow: 0 -4px 20px rgba(0,0,0,0.5); display: flex; justify-content: space-between; align-items: center; border-radius: 20px 20px 0 0; z-index: 90; border-top: 1px solid #2c2c2e; }
        .total-price { font-size: 20px; font-weight: 800; }
        .btn-checkout { background: var(--accent); color: white; border: none; padding: 14px 24px; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; }

        /* Нижнее меню */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 65px; background: var(--card); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #2c2c2e; z-index: 100; padding-bottom: env(safe-area-inset-bottom); }
        .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 11px; color: var(--muted); cursor: pointer; gap: 4px; width: 60px; }
        .nav-item.active { color: var(--accent); }
        .nav-icon { font-size: 22px; }
        .cart-badge { position: absolute; top: -2px; right: 10px; background: var(--danger); color: white; font-size: 10px; font-weight: bold; width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; display: none; }

        /* Админка */
        .admin-panel { background: var(--card); border-radius: 16px; padding: 20px; text-align: center; margin-top: 16px; }
        .btn-add-product { background: var(--accent); color: white; border: none; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: bold; width: 100%; cursor: pointer; margin-bottom: 10px; }
        .btn-copy { background: #2c2c2e; color: white; border: none; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: bold; width: 100%; cursor: pointer; }

        /* Модальное окно */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 16px; }
        .modal-overlay.active { display: flex; }
        .modal { background: var(--card); width: 100%; max-width: 400px; border-radius: 20px; padding: 20px; max-height: 90vh; overflow-y: auto; }
        .modal h2 { font-size: 18px; margin-bottom: 16px; text-align: center; }
        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
        .input-group input, .input-group textarea { width: 100%; background: var(--bg); border: 1px solid #2c2c2e; color: white; padding: 12px; border-radius: 10px; font-size: 14px; outline: none; }
        .file-upload-wrapper { position: relative; overflow: hidden; }
        .file-upload-btn { border: 1.5px dashed var(--accent); color: var(--accent); padding: 16px; border-radius: 10px; text-align: center; display: block; font-weight: 600; }
        .file-upload-wrapper input[type=file] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        .preview-container { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
        .preview-img { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; }
        .btn-save { background: var(--accent); color: white; border: none; padding: 14px; width: 100%; border-radius: 12px; font-weight: bold; font-size: 16px; margin-top: 10px; }
        .btn-close { background: transparent; color: var(--muted); border: none; width: 100%; padding: 12px; font-weight: bold; font-size: 14px; margin-top: 5px; }
        
        .empty-state { text-align: center; color: var(--muted); padding: 40px 0; font-size: 15px; grid-column: 1 / -1; }
    </style>
</head>
<body>

    <!-- ШАПКА -->
    <div class="header">
        <div class="shop-name">X.hunter77 <span class="verified">✔</span></div>
        <input type="text" class="search-box" id="searchInput" placeholder="Поиск по каталогу...">
    </div>

    <!-- ЭКРАН 1: ГЛАВНАЯ -->
    <div class="screen active" id="screen-home">
        <div class="catalog" id="catalog"></div>
    </div>

    <!-- ЭКРАН 2: КОРЗИНА -->
    <div class="screen" id="screen-cart">
        <h2 style="margin-top: 16px; margin-bottom: 16px;">Корзина</h2>
        <div id="cart-items"></div>
        <div id="cart-empty" class="empty-state" style="display: none;">Ваша корзина пуста 🛒</div>
    </div>

    <!-- ЭКРАН 3: ПРОФИЛЬ (АДМИНКА) -->
    <div class="screen" id="screen-profile">
        <h2 style="margin-top: 16px;">Профиль</h2>
        
        <!-- Блок для Админа -->
        <div class="admin-panel" id="admin-panel" style="display: none;">
            <p style="font-size: 14px; color: var(--muted); margin-bottom: 16px;">Вы вошли как Администратор</p>
            <button class="btn-add-product" id="openAddModalBtn">➕ Добавить товар</button>
            <button class="btn-copy" onclick="copyBotLink()">🔗 Скопировать ссылку на бота</button>
        </div>

        <!-- Блок для Покупателя -->
        <div class="admin-panel" id="user-panel">
            <p>Добро пожаловать в магазин!</p>
            <p style="font-size: 12px; color: var(--muted); margin-top: 10px;">Для связи с продавцом: @fhdhdjwdp</p>
        </div>
    </div>

    <!-- ПАНЕЛЬ СНИЗУ -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('home')">
            <span class="nav-icon">🏠</span> Главная
        </div>
        <div class="nav-item" onclick="switchTab('cart')">
            <span class="nav-icon">🛒</span> Корзина
            <div class="cart-badge" id="cart-badge">0</div>
        </div>
        <div class="nav-item" onclick="switchTab('profile')">
            <span class="nav-icon">👤</span> Профиль
        </div>
    </div>

    <!-- ПАНЕЛЬ ОФОРМЛЕНИЯ ЗАКАЗА -->
    <div class="cart-bottom" id="cart-bottom-bar" style="display: none;">
        <div>
            <div style="font-size: 12px; color: var(--muted);">Итого</div>
            <div class="total-price" id="total-price">0 ₽</div>
        </div>
        <button class="btn-checkout" onclick="checkout()">Оформить</button>
    </div>

    <!-- МОДАЛКА ДОБАВЛЕНИЯ ТОВАРА -->
    <div class="modal-overlay" id="addModal">
        <div class="modal">
            <h2>Новый товар</h2>
            <div class="input-group">
                <label>Название</label>
                <input type="text" id="addName" placeholder="Кроссовки Nike Air">
            </div>
            <div class="input-group">
                <label>Цена (₽)</label>
                <input type="number" id="addPrice" placeholder="4500">
            </div>
            <div class="input-group">
                <label>Описание</label>
                <textarea id="addDesc" placeholder="Размер 42, состояние идеал..."></textarea>
            </div>
            <div class="input-group">
                <label>Фото</label>
                <div class="file-upload-wrapper">
                    <span class="file-upload-btn">📸 Выбрать фото</span>
                    <input type="file" id="addImages" accept="image/*" multiple>
                </div>
                <div class="preview-container" id="imagePreview"></div>
            </div>
            <button class="btn-save" id="saveProductBtn">Сохранить товар</button>
            <button class="btn-close" onclick="closeAddModal()">Отмена</button>
        </div>
    </div>

    <script>
        // ==========================================
        // НАСТРОЙКИ
        const ADMIN_ID = 8264874574; // Твой ID
        const SELLER_USERNAME = 'fhdhdjwdp'; // Твой личный ник
        const BOT_USERNAME = 'xhunter77_store_bot'; // Твой бот
        // ==========================================

        const tg = window.Telegram?.WebApp;
        if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor('#0b0b0d'); tg.setBackgroundColor('#0b0b0d'); }

        const currentUser = tg?.initDataUnsafe?.user;
        const isAdmin = currentUser && currentUser.id === ADMIN_ID;

        // Показываем админку, если это владелец
        if (isAdmin) {
            document.getElementById('admin-panel').style.display = 'block';
            document.getElementById('user-panel').style.display = 'none';
        }

        let products = JSON.parse(localStorage.getItem('hunter_products')) || [];
        let cart = JSON.parse(localStorage.getItem('hunter_cart')) || [];
        let currentImagesBase64 = [];

        // --- НАВИГАЦИЯ ---
        function switchTab(tab) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            document.getElementById(`screen-${tab}`).classList.add('active');
            event.currentTarget.classList.add('active');
            
            if (tab === 'cart') renderCart();
            if (tab === 'home') renderCatalog();
        }

        // --- СЖАТИЕ ФОТО ---
        function compressImage(file, maxWidth = 800) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let scale = maxWidth / img.width;
                        if (scale > 1) scale = 1;
                        canvas.width = img.width * scale;
                        canvas.height = img.height * scale;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL('image/jpeg', 0.6));
                    };
                };
            });
        }

        document.getElementById('addImages').addEventListener('change', async (e) => {
            const files = e.target.files;
            if (!files.length) return;
            document.getElementById('imagePreview').innerHTML = 'Сжатие...';
            currentImagesBase64 = [];
            for (let i = 0; i < files.length; i++) {
                currentImagesBase64.push(await compressImage(files[i]));
            }
            document.getElementById('imagePreview').innerHTML = '';
            currentImagesBase64.forEach(src => {
                const img = document.createElement('img');
                img.src = src; img.className = 'preview-img';
                document.getElementById('imagePreview').appendChild(img);
            });
        });

        // --- ДОБАВЛЕНИЕ ТОВАРА ---
        document.getElementById('openAddModalBtn').addEventListener('click', () => {
            document.getElementById('addModal').classList.add('active');
        });
        function closeAddModal() {
            document.getElementById('addModal').classList.remove('active');
        }

        document.getElementById('saveProductBtn').addEventListener('click', () => {
            const name = document.getElementById('addName').value;
            const price = document.getElementById('addPrice').value;
            const desc = document.getElementById('addDesc').value;

            if (!name || !price || currentImagesBase64.length === 0) {
                if (tg) tg.showAlert('Заполните все поля и добавьте фото!'); else alert('Заполните все поля и добавьте фото!');
                return;
            }

            const newProduct = { id: Date.now(), name, price, desc: desc || 'Описание отсутствует', images: currentImagesBase64 };
            products.unshift(newProduct);
            localStorage.setItem('hunter_products', JSON.stringify(products));
            
            currentImagesBase64 = [];
            document.getElementById('addName').value = '';
            document.getElementById('addPrice').value = '';
            document.getElementById('addDesc').value = '';
            document.getElementById('imagePreview').innerHTML = '';
            closeAddModal();
            renderCatalog();
            if (tg) tg.HapticFeedback.notificationOccurred('success');
        });

        // --- ОТРИСОВКА КАТАЛОГА ---
        function renderCatalog(filterText = '') {
            const catalog = document.getElementById('catalog');
            catalog.innerHTML = '';
            
            const filtered = products.filter(p => p.name.toLowerCase().includes(filterText.toLowerCase()));

            if (filtered.length === 0) {
                catalog.innerHTML = `<div class="empty-state">Товаров пока нет</div>`;
                return;
            }

            filtered.forEach(product => {
                const isInCart = cart.some(c => c.id === product.id);
                
                const card = document.createElement('div');
                card.className = 'product-card';
                
                const deleteBtnHTML = isAdmin 
                    ? `<button class="delete-btn-card" onclick="event.stopPropagation(); deleteProduct(${product.id})">✕</button>` 
                    : '';

                card.innerHTML = `
                    <div class="img-container">
                        <img src="${product.images[0]}" class="product-image">
                        ${deleteBtnHTML}
                    </div>
                    <div class="product-info">
                        <div class="product-title">${product.name}</div>
                        <div class="product-price">${product.price} ₽</div>
                        <button class="btn-add-cart ${isInCart ? 'in-cart' : ''}" onclick="toggleCart(${product.id})">
                            ${isInCart ? 'В корзине' : '🛒 В корзину'}
                        </button>
                    </div>
                `;
                catalog.appendChild(card);
            });
        }

        // --- КОРЗИНА ---
        function toggleCart(id) {
            const product = products.find(p => p.id === id);
            const cartIndex = cart.findIndex(c => c.id === id);

            if (cartIndex > -1) {
                cart.splice(cartIndex, 1);
            } else {
                cart.push({ ...product, qty: 1 });
            }
            
            localStorage.setItem('hunter_cart', JSON.stringify(cart));
            updateCartBadge();
            renderCatalog(document.getElementById('searchInput').value);
            if (tg) tg.HapticFeedback.impactOccurred('light');
        }

        function updateCartBadge() {
            const badge = document.getElementById('cart-badge');
            const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
            badge.innerText = totalItems;
            badge.style.display = totalItems > 0 ? 'flex' : 'none';
        }

        function renderCart() {
            const container = document.getElementById('cart-items');
            const empty = document.getElementById('cart-empty');
            const bottomBar = document.getElementById('cart-bottom-bar');
            
            container.innerHTML = '';
            
            if (cart.length === 0) {
                empty.style.display = 'block';
                bottomBar.style.display = 'none';
                return;
            }

            empty.style.display = 'none';
            bottomBar.style.display = 'flex';

            let total = 0;

            cart.forEach((item, index) => {
                total += (item.price * item.qty);
                const el = document.createElement('div');
                el.className = 'cart-item';
                el.innerHTML = `
                    <img src="${item.images[0]}" class="cart-img">
                    <div class="cart-details">
                        <div class="cart-title">${item.name}</div>
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <div class="cart-price">${item.price} ₽</div>
                            <div class="qty-controls">
                                <button class="qty-btn" onclick="changeQty(${index}, -1)">-</button>
                                <span>${item.qty}</span>
                                <button class="qty-btn" onclick="changeQty(${index}, 1)">+</button>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(el);
            });

            document.getElementById('total-price').innerText = total + ' ₽';
        }

        function changeQty(index, delta) {
            cart[index].qty += delta;
            if (cart[index].qty <= 0) {
                cart.splice(index, 1);
            }
            localStorage.setItem('hunter_cart', JSON.stringify(cart));
            updateCartBadge();
            renderCart();
            renderCatalog(document.getElementById('searchInput').value);
        }

        // --- ОФОРМЛЕНИЕ ЗАКАЗА ---
        function checkout() {
            if (cart.length === 0) return;

            let message = `🛍 *Новый заказ!*\n\n`;
            let total = 0;

            cart.forEach(item => {
                const itemTotal = item.price * item.qty;
                total += itemTotal;
                message += `▪️ ${item.name}\n   ${item.qty} шт. x ${item.price} ₽ = *${itemTotal} ₽*\n\n`;
            });

            message += `💰 *ИТОГО: ${total} ₽*\n\n`;
            message += `Здравствуйте! Я хочу оформить этот заказ.`;

            const encodedMessage = encodeURIComponent(message);
            const url = `https://t.me/${SELLER_USERNAME}?text=${encodedMessage}`;

            if (tg) {
                tg.openTelegramLink(url);
            } else {
                window.open(url, '_blank');
            }
        }

        // --- УДАЛЕНИЕ ТОВАРА (ТОЛЬКО АДМИН) ---
        function deleteProduct(id) {
            if (!isAdmin) return;
            if (tg) {
                tg.showConfirm('Удалить этот товар?', (confirmed) => {
                    if (confirmed) {
                        products = products.filter(p => p.id !== id);
                        cart = cart.filter(c => c.id !== id);
                        localStorage.setItem('hunter_products', JSON.stringify(products));
                        localStorage.setItem('hunter_cart', JSON.stringify(cart));
                        renderCatalog();
                        updateCartBadge();
                    }
                });
            }
        }

        // --- КОПИРОВАНИЕ ССЫЛКИ ---
        function copyBotLink() {
            const link = `https://t.me/${BOT_USERNAME}`;
            navigator.clipboard.writeText(link).then(() => {
                if (tg) tg.showAlert('Ссылка на бота скопирована!');
            });
        }

        // --- ПОИСК ---
        document.getElementById('searchInput').addEventListener('input', (e) => {
            renderCatalog(e.target.value);
        });

        // --- СТАРТ ---
        renderCatalog();
        updateCartBadge();

    </script>
</body>
</html>
